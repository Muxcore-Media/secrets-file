services:
  secrets-file:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "9500"
    environment:
      MUXCORE_GRPC_ADDR: core:9090
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
      MUXCORE_MODULE_ID: secrets-file
      SECRETS_STORE: /data/secrets.json
    volumes:
      - secrets-data:/data

volumes:
  secrets-data:
