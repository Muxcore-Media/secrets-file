services:
  core:
    image: ghcr.io/muxcore-media/core:latest
    ports:
      - "9090:9090"
    environment:
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  secrets-file:
    build:
      context: ..
      dockerfile: Dockerfile
    volumes:
      - secrets-data:/var/lib/secrets-file
    environment:
      MUXCORE_GRPC_ADDR: core:9090
      MUXCORE_INSECURE_DISABLE_TLS: "true"
      MUXCORE_LOG_LEVEL: debug
      MUXCORE_MODULE_ID: secrets-file
      SECRETS_STORE: /var/lib/secrets-file/secrets.json
      SECRETS_KEY_FILE: /var/lib/secrets-file/master.key
      SECRETS_GRPC_ADDR: 127.0.0.1:9550
    depends_on:
      core:
        condition: service_healthy

volumes:
  secrets-data:
